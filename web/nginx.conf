server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # 文档上传最多 20 MiB；AI 解析最多三分钟。
    location /api/host-import/ {
        client_max_body_size 40m;
        proxy_read_timeout 200s;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
    }

    # 诱饵远程安装经 SSH 推送约 20 MB 运行端，服务端最长两分钟。
    location /api/decoy-install/ {
        proxy_read_timeout 200s;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前端与 API 同源，避免 CORS
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        # 带上客户端地址，server 按 TRUSTED_PROXIES 还原，登录退避与审计才按真人计
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
