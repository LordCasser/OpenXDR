server {
    listen 80;
    root /usr/share/nginx/html;

    # 安全头：CSP 只放同源脚本；antd 的 CSS-in-JS 在运行时插 style，style-src 需留内联。
    # HSTS 由 Caddy（真正对外终止 TLS 的那层）发，内层 nginx 只跑 HTTP。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri /index.html;
    }

    # 文档上传最多 20 MiB；AI 解析最多三分钟。
    location /api/host-import/ {
        client_max_body_size 40m;
        proxy_read_timeout 200s;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
    }

    # 诱饵远程安装经 SSH 推送约 20 MB 运行端，服务端最长两分钟。
    location /api/decoy-install/ {
        proxy_read_timeout 200s;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前端与 API 同源，避免 CORS
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        # 带上客户端地址，server 按 TRUSTED_PROXIES 还原，登录退避与审计才按真人计
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 会话 cookie 的 Secure 属性看 X-Forwarded-Proto：Caddy 已按原始协议覆盖写入，
        # 这里原样透传（nginx 默认转发请求头），不能改成 $scheme，那会永远得到 http。
    }
}
