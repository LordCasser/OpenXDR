technique: T1003.001
name: LSASS Memory Dump
cases:
  - name: comsvcs.dll MiniDump 转储 lsass
    source: atomic T1003.001
    class: 1007
    os: windows
    event:
      process:
        name: rundll32.exe
        file:
          path: "C:\\Windows\\System32\\rundll32.exe"
        cmd_line: "rundll32.exe C:\\windows\\system32\\comsvcs.dll, MiniDump 672 C:\\Windows\\Temp\\lsass.dmp full"

  - name: procdump 转储 lsass
    source: atomic T1003.001
    class: 1007
    os: windows
    event:
      process:
        name: procdump.exe
        file:
          path: "C:\\Tools\\procdump.exe"
        cmd_line: "procdump.exe -accepteula -ma lsass.exe C:\\Windows\\Temp\\lsass.dmp"

  - name: taskmgr 之外的 lsass 访问（命令行含 lsass）
    source: atomic T1003.001
    class: 1007
    os: windows
    event:
      process:
        name: cmd.exe
        file:
          path: "C:\\Windows\\System32\\cmd.exe"
        cmd_line: "cmd.exe /c tasklist | findstr lsass"
    expect: undetected

  - name: Linux 读取 shadow 文件
    technique: T1003.008
    source: atomic T1003.008
    class: 1007
    os: linux
    event:
      process:
        name: cat
        cmd_line: "cat /etc/shadow"

  - name: find 全盘搜索 SSH 私钥
    technique: T1552.004
    source: atomic T1552.004
    class: 1007
    os: linux
    event:
      process:
        name: find
        file:
          path: /usr/bin/find
        cmd_line: "find / -name id_rsa"

  - name: find 搜到私钥后 cp 到暂存目录
    technique: T1552.004
    source: atomic T1552.004
    class: 1007
    os: linux
    event:
      process:
        name: cp
        file:
          path: /usr/bin/cp
        cmd_line: "cp --parents /root/.ssh/id_rsa /tmp/art-staging"

  - name: 直接读取主机私钥
    technique: T1552.004
    source: atomic T1552.004
    class: 1007
    os: linux
    event:
      process:
        name: cat
        file:
          path: /usr/bin/cat
        cmd_line: "cat /etc/ssh/ssh_host_ed25519_key"

  - name: 良性对照：ssh -i 用私钥登录
    technique: T1552.004
    source: 运维日常
    class: 1007
    os: linux
    event:
      process:
        name: ssh
        file:
          path: /usr/bin/ssh
        cmd_line: "ssh -i /root/.ssh/id_ed25519 backup@10.0.0.5"
    expect: undetected

  - name: 良性对照：读取公钥分发
    technique: T1552.004
    source: 运维日常
    class: 1007
    os: linux
    event:
      process:
        name: cat
        file:
          path: /usr/bin/cat
        cmd_line: "cat /root/.ssh/id_ed25519.pub"
    expect: undetected

  - name: 良性对照：ssh-keygen 生成密钥
    technique: T1552.004
    source: 运维日常
    class: 1007
    os: linux
    event:
      process:
        name: ssh-keygen
        file:
          path: /usr/bin/ssh-keygen
        cmd_line: "ssh-keygen -t ed25519 -f /root/.ssh/id_ed25519 -N ''"
    expect: undetected
