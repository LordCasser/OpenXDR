technique: T1547.001
name: Registry Run Keys / Startup Folder
cases:
  - name: 注册表 Run 键新增值（采集端 diff 出的注册表事件）
    source: atomic T1547.001
    class: 201002
    os: windows
    event:
      activity_id: 1
      reg_key:
        path: "HKCU\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\\Atomic"
      reg_value:
        data: "C:\\Users\\Public\\evil.exe"

  - name: Winlogon Shell 劫持
    technique: T1547.004
    source: atomic T1547.004
    class: 201002
    os: windows
    event:
      activity_id: 3
      reg_key:
        path: "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\Shell"
      reg_value:
        data: "explorer.exe, C:\\evil.exe"

  - name: reg.exe 命令行写 Run 键（进程视角）
    source: atomic T1547.001
    class: 1007
    os: windows
    event:
      process:
        name: reg.exe
        file:
          path: "C:\\Windows\\System32\\reg.exe"
        cmd_line: 'reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v Atomic /t REG_SZ /d "C:\evil.exe" /f'

  - name: reg.exe 写 Run 键（实机 ETW 带引号全路径形态）
    technique: T1547.001
    source: 实机回放 2026-08-09
    class: 1007
    os: windows
    event:
      process:
        name: reg.exe
        cmd_line: '"C:\Windows\System32\reg.exe" add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v Atomic /t REG_SZ /d "C:\evil.exe" /f'

  - name: 新服务安装（服务快照 diff 出的新增）
    technique: T1543.003
    source: atomic T1543.003
    class: 201002
    os: windows
    event:
      activity_id: 1
      reg_key:
        path: "HKLM\\SYSTEM\\CurrentControlSet\\Services\\atomic"
      reg_value:
        data: "ImagePath=C:\\Users\\Public\\evil.exe; Start=2"

  - name: 已有服务 ImagePath 被篡改（旧版 agent，修改事件不带旧值）
    technique: T1543.003
    source: atomic T1543.003
    class: 201002
    os: windows
    level: medium
    event:
      activity_id: 3
      reg_key:
        path: "HKLM\\SYSTEM\\CurrentControlSet\\Services\\WaaSMedicSvc"
      reg_value:
        data: "ImagePath=C:\\Users\\Public\\evil.exe; Start=2"

  - name: 内置服务 ImagePath 改成 PowerShell（sc config Fax binPath=）
    technique: T1543.003
    source: atomic T1543.003 #1
    class: 201002
    os: windows
    level: high
    event:
      activity_id: 3
      reg_key:
        path: "HKLM\\SYSTEM\\CurrentControlSet\\Services\\Fax"
      reg_value:
        data: "ImagePath=C:\\windows\\system32\\WindowsPowerShell\\v1.0\\powershell.exe -noexit -c \"write-host 'T1543.003 Test'\"; Start=3; State=Stopped"
        prev_data: "ImagePath=%systemroot%\\system32\\fxssvc.exe; Start=3; State=Stopped"
        changed: "ImagePath"

  - name: 内置服务 ImagePath 指向用户目录（sc config wuauserv binPath=）
    technique: T1543.003
    source: atomic T1543.003 同手法，目标换成 C:\Users\Public
    class: 201002
    os: windows
    level: high
    event:
      activity_id: 3
      reg_key:
        path: "HKLM\\SYSTEM\\CurrentControlSet\\Services\\wuauserv"
      reg_value:
        data: "ImagePath=C:\\Users\\Public\\x.exe; ServiceDll=%systemroot%\\system32\\wuaueng.dll; Start=3; State=Stopped"
        prev_data: "ImagePath=%systemroot%\\system32\\svchost.exe -k netsvcs -p; ServiceDll=%systemroot%\\system32\\wuaueng.dll; Start=3; State=Stopped"
        changed: "ImagePath"

  - name: svchost 服务的 ServiceDll 被换（ImagePath 不变）
    technique: T1543.003
    source: "T1543.003 ServiceDll 劫持（reg add …\\Parameters /v ServiceDll）"
    class: 201002
    os: windows
    level: high
    event:
      activity_id: 3
      reg_key:
        path: "HKLM\\SYSTEM\\CurrentControlSet\\Services\\IKEEXT"
      reg_value:
        data: "ImagePath=%systemroot%\\system32\\svchost.exe -k netsvcs -p; ServiceDll=C:\\Users\\Public\\evil.dll; Start=3; State=Stopped"
        prev_data: "ImagePath=%systemroot%\\system32\\svchost.exe -k netsvcs -p; ServiceDll=%SystemRoot%\\System32\\ikeext.dll; Start=3; State=Stopped"
        changed: "ServiceDll"

  - name: BITS 按需起停（启动类型与运行状态一起翻，良性对照）
    technique: T1543.003
    source: 生产测试机 OPENXDR-TESTWIN 2026-10-20，每 15 分钟一次
    class: 201002
    os: windows
    expect: undetected
    event:
      activity_id: 3
      reg_key:
        path: "HKLM\\SYSTEM\\CurrentControlSet\\Services\\BITS"
      reg_value:
        data: "ImagePath=%SystemRoot%\\System32\\svchost.exe -k netsvcs -p; ServiceDll=%SystemRoot%\\System32\\qmgr.dll; Start=2; State=Running"
        prev_data: "ImagePath=%SystemRoot%\\System32\\svchost.exe -k netsvcs -p; ServiceDll=%SystemRoot%\\System32\\qmgr.dll; Start=3; State=Stopped"
        changed: "Start,State"

  - name: wuauserv 被系统停止（只有运行状态变，良性对照）
    technique: T1543.003
    source: 生产测试机 OPENXDR-TESTWIN 2026-10-20
    class: 201002
    os: windows
    expect: undetected
    event:
      activity_id: 3
      reg_key:
        path: "HKLM\\SYSTEM\\CurrentControlSet\\Services\\wuauserv"
      reg_value:
        data: "ImagePath=%systemroot%\\system32\\svchost.exe -k netsvcs -p; ServiceDll=%systemroot%\\system32\\wuaueng.dll; Start=3; State=Stopped"
        prev_data: "ImagePath=%systemroot%\\system32\\svchost.exe -k netsvcs -p; ServiceDll=%systemroot%\\system32\\wuaueng.dll; Start=3; State=Running"
        changed: "State"

  - name: Defender 平台更新挪驱动目录（执行目标仍在 System32，留 medium 不升 high）
    technique: T1543.003
    source: 生产测试机 OPENXDR-TESTWIN 2026-10-20 WdNisDrv
    class: 201002
    os: windows
    level: medium
    event:
      activity_id: 3
      reg_key:
        path: "HKLM\\SYSTEM\\CurrentControlSet\\Services\\WdNisDrv"
      reg_value:
        data: "ImagePath=system32\\drivers\\wd\\WdNisDrv.sys; Start=3; State=Stopped"
        prev_data: "ImagePath=system32\\Drivers\\WdNisDrv.sys; Start=3; State=Stopped"
        changed: "ImagePath"

  - name: IFEO Debugger 劫持（快照 diff 注册表事件）
    technique: T1546.012
    source: atomic T1546.012
    class: 201002
    os: windows
    event:
      activity_id: 1
      reg_key:
        path: "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options\\notepad.exe\\Debugger"
      reg_value:
        data: "C:\\Users\\Public\\evil.exe"

  - name: WMI 永久事件订阅（CommandLineEventConsumer，伪路径文件事件）
    technique: T1546.003
    source: atomic T1546.003
    class: 1001
    os: windows
    event:
      activity_id: 1
      file:
        path: "wmi:root\\subscription\\__EventConsumer.EvilConsumer"
      wmi:
        data: '{"CommandLineTemplate":"C:\\Users\\Public\\evil.exe","Name":"EvilConsumer"}'

  - name: COM 劫持 HKCU CLSID InprocServer32（实机回放第四轮的原始事件）
    technique: T1546.015
    source: atomic T1546.015
    class: 201002
    os: windows
    event:
      activity_id: 1
      reg_key:
        path: "HKCU\\Software\\Classes\\CLSID\\{11111111-2222-3333-4444-555555555555}\\InprocServer32\\"
      reg_value:
        data: "C:\\evil.dll"

  - name: COM 劫持改写已有 HKCU CLSID 的 LocalServer32 指向 AppData 下的 EXE
    technique: T1546.015
    source: atomic T1546.015
    class: 201002
    os: windows
    event:
      activity_id: 3
      reg_key:
        path: "HKCU\\Software\\Classes\\CLSID\\{b5f8350b-0548-48b1-a6ee-88bd00b4a5e7}\\LocalServer32\\"
      reg_value:
        data: "C:\\Users\\alice\\AppData\\Roaming\\Microsoft\\update.exe"

  - name: COM 劫持指向 OneDrive 目录但文件名不对（排除按目录+文件名收窄）
    technique: T1546.015
    source: atomic T1546.015 变体
    class: 201002
    os: windows
    event:
      activity_id: 1
      reg_key:
        path: "HKCU\\Software\\Classes\\CLSID\\{BCDE0395-E52F-467C-8E3D-C4579291692E}\\InprocServer32\\"
      reg_value:
        data: "C:\\Users\\alice\\AppData\\Local\\Microsoft\\OneDrive\\evil.dll"

  - name: OneDrive 按用户安装注册外壳扩展（良性对照）
    technique: T1546.015
    source: OneDrive 按用户安装
    class: 201002
    os: windows
    expect: undetected
    event:
      activity_id: 1
      reg_key:
        path: "HKCU\\Software\\Classes\\CLSID\\{CB3D0F55-BC2C-4C1A-85ED-23ED75B5106B}\\InprocServer32\\"
      reg_value:
        data: "C:\\Users\\alice\\AppData\\Local\\Microsoft\\OneDrive\\24.201.1006.0005\\FileSyncShell64.dll"

  - name: Office 在 HKCU 注册指向 Program Files 的 COM 服务器（良性对照）
    technique: T1546.015
    source: Office 按用户注册
    class: 201002
    os: windows
    expect: undetected
    event:
      activity_id: 1
      reg_key:
        path: "HKCU\\Software\\Classes\\CLSID\\{2DF8D04C-5BFA-101B-BDE5-00AA0044DE52}\\LocalServer32\\"
      reg_value:
        data: "\"C:\\Program Files\\Microsoft Office\\root\\Office16\\WINWORD.EXE\" /Automation"

  - name: COM 注册的 ThreadingModel 附属值（不重复告警）
    technique: T1546.015
    source: atomic T1546.015 附属值
    class: 201002
    os: windows
    expect: undetected
    event:
      activity_id: 1
      reg_key:
        path: "HKCU\\Software\\Classes\\CLSID\\{11111111-2222-3333-4444-555555555555}\\InprocServer32\\ThreadingModel"
      reg_value:
        data: "Apartment"

  - name: 删除 HKCU CLSID 注册（清理，不按劫持报）
    technique: T1546.015
    source: 实机回放第四轮的删除事件
    class: 201002
    os: windows
    expect: undetected
    event:
      activity_id: 4
      reg_key:
        path: "HKCU\\Software\\Classes\\CLSID\\{11111111-2222-3333-4444-555555555555}\\InprocServer32\\"
      reg_value:
        data: "C:\\evil.dll"
