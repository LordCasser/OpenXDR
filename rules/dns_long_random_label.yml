title: DNS Query with Long Random Label
id: 417d0a2d-f528-407d-bc82-37b919e3af89
status: experimental
description: |
  检测域名里出现很长的纯字母数字标签（40 个字符以上）——DNS 隧道与经 DNS 外传数据的典型特征：
  数据编码成 base32 / hex 塞进子域名。正常服务的长标签多带连字符（如云负载均衡名），不在此列。
author: OpenXDR
tags:
  - attack.command_and_control
  - attack.t1071.004
  - attack.exfiltration
  - attack.t1048.003
logsource:
  category: dns
detection:
  long_label:
    query|re: '(^|\.)[a-z0-9]{40,}\.'
  condition: long_label
level: medium
