title: Windows Service Installed or Execution Target Changed
id: 8c4e2a7b-3f9d-4b6e-a1c8-5e7d9f2b4a63
status: experimental
description: |
  检测 Windows 服务快照 diff 出的新增服务，以及已有服务换了执行目标
  （ImagePath / ServiceDll / FailureCommand）或被禁用（Start 改成 4）。
  与 sc.exe / New-Service 的进程视角互补：直接写注册表的服务安装也能看见。
  系统自己翻启动类型、运行状态的修改不报——BITS、wuauserv 这类按需服务
  一夜起停几百次，安全服务被停由 Security Service Stopped 专盯。
  agent 的修改事件带 reg_value.changed（变了的字段名）；旧版 agent 没有
  这个字段，说不清改了什么，修改照旧全报。内置服务的执行目标被换到系统
  目录外由 Built-in Windows Service Hijacked 另报 high。
tags:
  - attack.persistence
  - attack.t1543.003
logsource:
  category: registry_set
  product: windows
detection:
  services:
    TargetObject|startswith: 'HKLM\SYSTEM\CurrentControlSet\Services\'
  created:
    activity_id: 1
  modified:
    activity_id: 3
  target_changed:
    reg_value.changed|contains:
      - 'ImagePath'
      - 'ServiceDll'
      - 'FailureCommand'
  disabled:
    reg_value.changed|contains: 'Start'
    Details|re: '(^|; )Start=4(;|$)'
  old_agent:
    reg_value.changed: null
  condition: services and (created or (modified and (target_changed or disabled or old_agent)))
level: medium
