id: daily-host-inspection
name: 每日主机巡检
# 五段 cron；不写 CRON_TZ 时按 server 本地时区（容器里通常是 UTC），这里固定北京时间凌晨 2 点
schedule: "CRON_TZ=Asia/Shanghai 0 2 * * *"
# 留空使用平台默认模型
model: ""
# "*" 表示每个组各跑一次；也可写组名
targets: { group: "*" }
# 名单外命令的审批等待上限，超时按拒绝处理。夜里无人值守，等久了只会耗光 30 分钟运行时长
approval_timeout: 2m
# 不写默认演练。巡检要拿到真实输出所以显式关掉；命令仍须过组内 AI 白名单或人工审批，
# 且 RESPONSE_ENABLED=true 时才会下发。建议先把只读命令（df、ss、last 等）加进白名单
dry_run: false
prompt: |
  对本组每台主机做一次运维与安全巡检，覆盖：
  1. 运维：磁盘与 inode 使用率、内存与负载、异常退出或频繁重启的服务、时间同步。
  2. 安全：新增或可疑的账户与 sudo 权限、监听端口与对外连接、计划任务与自启动项、
     近 24 小时的登录失败与异地登录、平台已有的未处理告警与 incident。
  3. 平台告警用 query 按主机拆开：近 24 小时每台主机命中了哪些规则、级别与次数，
     以及仍处于 triaged（未人工结案）的 incident 标题与 AI 结论。
  4. 待办闭环：先逐条复查 open_findings（遗留待办），已修复的 track 标 resolved，仍存在的 track 标 open；
     本次新发现、需要人处理的问题逐个用 track 登记。ignored_findings 是人工忽略的，不再报。
  只使用只读命令。命令未获审批或执行失败时，在报告中如实注明，不要换一种写法绕过。
  最后用 report 提交一份报告：先给总体结论与需要人处理的事项（分新增、仍未解决、本轮已修复三类），再按主机列出发现；
  明确区分已观察到的事实、推断与未能验证的部分。
