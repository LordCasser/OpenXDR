max_payload: 4MB
server_name: __NODE_NAME__
listen: 127.0.0.1:4222
http: 127.0.0.1:8222

jetstream {
  store_dir: /data/jetstream
  max_file_store: 20GB
  sync_interval: 1s
}

cluster {
  name: openxdr
  listen: 0.0.0.0:6222
  # 显式通告路由地址：监听 0.0.0.0 时通告出去的地址经 gossip 传回，会让节点反复拨自己并在 TLS 校验上失败刷屏
  advertise: __NODE_IP__:6222
  authorization {
    user: openxdr-route
    password: __NATS_ROUTE_PASSWORD_CONF__
    timeout: 2
  }
  tls {
    cert_file: /run/secrets/nats.crt
    key_file: /run/secrets/nats.key
    ca_file: /run/secrets/ha-ca.crt
    verify: true
    timeout: 3
  }
  routes = [
    tls://openxdr-route:__NATS_ROUTE_PASSWORD_URL__@__PEER_IP__:6222
    tls://openxdr-route:__NATS_ROUTE_PASSWORD_URL__@__WITNESS_HOST__:6222
  ]
}
