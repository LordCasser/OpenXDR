max_payload: 4MB
server_name: openxdr-witness
listen: 127.0.0.1:4222
http: 127.0.0.1:8222

jetstream {
  store_dir: /var/lib/openxdr-nats/jetstream
  max_file_store: 20GB
  sync_interval: 1s
}

cluster {
  name: openxdr
  listen: 0.0.0.0:6222
  authorization {
    user: openxdr-route
    password: __NATS_ROUTE_PASSWORD__
    timeout: 2
  }
  tls {
    cert_file: /opt/openxdr-ha-witness/secrets/nats.crt
    key_file: /opt/openxdr-ha-witness/secrets/nats.key
    ca_file: /opt/openxdr-ha-witness/secrets/ha-ca.crt
    verify: true
    timeout: 3
  }
  # 两个内网节点会主动拨入 witness；这里保留显式 route 使 JetStream 启用
  # cluster 模式。Witness 无法直达 RFC1918 地址时会重试，不影响已拨入的双向 route。
  routes = [
    tls://openxdr-route:__NATS_ROUTE_PASSWORD__@10.1.1.198:6222
    tls://openxdr-route:__NATS_ROUTE_PASSWORD__@10.1.1.197:6222
  ]
}
