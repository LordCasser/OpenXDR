global_defs {
  enable_script_security
  script_user root
}

vrrp_script openxdr_ready {
  script "/usr/bin/wget -q -T 2 -O /dev/null http://127.0.0.1:8080/readyz"
  interval 2
  timeout 3
  fall 2
  rise 2
  weight -40
}

vrrp_instance OPENXDR {
  state __KEEPALIVED_STATE__
  interface eth0
  virtual_router_id 51
  priority __KEEPALIVED_PRIORITY__
  advert_int 1
  authentication {
    auth_type PASS
    auth_pass __VRRP_PASSWORD__
  }
  unicast_src_ip __NODE_IP__
  unicast_peer {
    __PEER_IP__
  }
  virtual_ipaddress {
    10.1.1.199/24 dev eth0
  }
  track_script {
    openxdr_ready
  }
}
