groups:
  - name: openxdr
    rules:
      - alert: OpenXDRNodeDown
        expr: up{job="openxdr"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: OpenXDR server 节点不可用
      - alert: OpenXDRQueueBacklog
        expr: max by (shard) (openxdr_queue_pending_messages) > 10000
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: JetStream 分片积压超过 10000 条
      - alert: OpenXDRQueueReplicaUnhealthy
        expr: max(openxdr_queue_replicas_unhealthy) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: JetStream 事件流有 {{ $value }} 个副本不同步，再坏一个节点就会失去多数、入队全停
      - alert: OpenXDRPipelineFailures
        expr: sum(rate(openxdr_pipeline_failures_total[5m])) > 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: OpenXDR 事件处理持续失败
      - alert: OpenXDRProcessingLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(openxdr_event_processing_seconds_bucket[5m]))) > 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: OpenXDR 事件处理 P95 超过 1 秒
      - alert: OpenXDRCollectorSilent
        expr: max by (capability) (openxdr_collector_capability_problem_hosts{silent="true"}) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} 台在线主机的 {{ $labels.capability }} 采集通道开着却持续收不到事件（agent 自检也没看到），检测处于失明状态"
