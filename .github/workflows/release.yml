name: Release

# 推 v* 标签即发版：编 agent / sensor → 把 agent 打进 server 镜像、推 GHCR（amd64 + arm64）→ 建 GitHub Release。
# Release 附件：install.sh（一行安装）、docker-compose.yml、各平台安装包与 SHA256SUMS。
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  binaries:
    name: 采集端安装包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # musl 静态链接：一个二进制跑遍新老发行版（CentOS 7 也行）；mingw 给 Windows 目标
      - name: 安装交叉编译工具
        run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,x86_64-pc-windows-gnu
      - name: 安装 nightly 与 bpf-linker
        # pin 0.10.4 的原因见 ci.yml
        run: |
          rustup toolchain install nightly --component rust-src
          cargo install bpf-linker --version 0.10.4 --locked
      - name: agent（Linux，带 eBPF）
        working-directory: agent
        # 默认构建没有 Linux 网络采集，分发包必须是 eBPF 构建；拿不到 eBPF 时它自己退到 netlink / 轮询
        run: |
          cargo build --release --locked --features ebpf --target x86_64-unknown-linux-musl
          strings target/x86_64-unknown-linux-musl/release/openxdr-agent | grep -q inet_sock_set_state
      - name: agent（Windows）
        working-directory: agent
        run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - name: sensor（Linux）
        working-directory: sensor
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: 整理
        run: |
          mkdir -p out/dist
          cp agent/target/x86_64-unknown-linux-musl/release/openxdr-agent out/dist/openxdr-agent-linux-amd64
          cp agent/target/x86_64-pc-windows-gnu/release/openxdr-agent.exe out/dist/openxdr-agent-windows-amd64.exe
          cp sensor/target/x86_64-unknown-linux-musl/release/openxdr-sensor out/openxdr-sensor-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: out

  images:
    name: 容器镜像
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: out
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 标签
        id: tags
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          tag='${{ github.ref_name }}'
          for img in server web; do
            list="ghcr.io/$owner/openxdr-$img:$tag"
            # 预发布版（带 -）不动 latest
            case $tag in *-*) ;; *) list="$list,ghcr.io/$owner/openxdr-$img:latest" ;; esac
            echo "$img=$list" >> "$GITHUB_OUTPUT"
          done
      - name: server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          # 把 agent 安装包打进镜像：升级镜像，在线 agent 跟着自动升级
          build-contexts: agents=out
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.server }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: web
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.web }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  release:
    name: GitHub Release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: out
      - name: 附件
        run: |
          tag='${{ github.ref_name }}'
          mkdir assets
          cp out/dist/* out/openxdr-sensor-linux-amd64 assets/
          # 安装脚本钉住本版本：用户拿到的哪个 Release 的脚本，就装哪个版本
          sed "s/__OPENXDR_VERSION__/$tag/" deploy/install/install.sh > assets/install.sh
          cp deploy/install/docker-compose.yml assets/
          (cd assets && sha256sum -- * > SHA256SUMS)
      - name: 说明
        run: |
          tag='${{ github.ref_name }}'
          ver=${tag#v}
          {
            sed "s/__OPENXDR_VERSION__/$tag/g" deploy/install/RELEASE_NOTES.md
            echo
            # 本版本的变更记录：CHANGELOG 里 ## [版本] 到下一个 ## [ 之间
            awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md
          } > notes.md
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ github.ref_name }}'
          pre=""; case $tag in *-*) pre="--prerelease" ;; esac
          gh release create "$tag" --title "OpenXDR $tag" --notes-file notes.md $pre assets/*
